services:

  apache:
    container_name: apache
    image: php:8.3-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /home/vm/git-dir/web:/var/www/html:z
    networks:
      default:


  db:
    container_name: mariaDB
    image: mariadb:11
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
#    networks:
#      default:
